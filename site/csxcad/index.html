<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0b1422">
<meta name="description" content="Parametric CSXCAD geometry editor for Radiators openEMS antenna configurations.">
<title>CSXCAD Editor</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./app.css?v=EDITOR_BUILD">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }
</script>
<script type="module" src="./js/main.js?v=EDITOR_BUILD"></script>
</head>
<body data-sheet="">
<header class="topbar">
  <div class="brand" title="Radiators CSXCAD"><img class="brand-logo" src="./icon.svg" alt="Radiators" width="30" height="30"><span class="brand-text">Radiators</span></div>
  <div class="docname">
    <input id="docName" aria-label="Simulation name" spellcheck="false" autocomplete="off">
    <span id="docMeta" class="muted">schema v2 · mm</span>
  </div>
  <div class="top-actions">
    <button id="undo" class="icon" title="Undo (Ctrl+Z)" aria-label="Undo" disabled><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button id="redo" class="icon" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5M20 9H9.5a5.5 5.5 0 0 0 0 11H13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <label class="button" title="Open antenna JSON, result JSON or sweep ZIP">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span class="label"> Open</span>
      <input type="file" id="openFile" accept=".json,.zip,application/json,application/zip,application/x-zip-compressed" hidden>
    </label>
    <button id="save" class="primary" title="Download the antenna JSON for antennas/ (Ctrl+S)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="label"> Save JSON</span></button>
    <div class="menu-wrap">
      <button id="menuButton" class="icon" aria-haspopup="menu" aria-expanded="false" aria-label="More"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.5h.01M12 12h.01M12 18.5h.01" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div id="menu" class="menu" role="menu" hidden>
        <button role="menuitem" data-action="new">New from starter</button>
        <button role="menuitem" data-action="local-projects">Open local projects…</button>
        <button role="menuitem" data-action="save-local">Save locally</button>
        <button role="menuitem" data-action="examples">Open example…</button>
        <button role="menuitem" data-action="json">JSON source…</button>
        <button role="menuitem" data-action="export-case">Export resolved case JSON</button>
        <button role="menuitem" data-action="copy">Copy JSON to clipboard</button>
        <button role="menuitem" data-action="paste">Paste JSON from clipboard</button>
        <button role="menuitem" data-action="screenshot">Save screenshot (PNG)</button>
        <hr>
        <button role="menuitem" data-action="workspace-units">Workspace units…</button>
        <button role="menuitem" data-action="theme">Toggle light / dark</button>
        <button role="menuitem" data-action="about">About this editor</button>
        <div class="editor-build">Build EDITOR_BUILD</div>
      </div>
    </div>
  </div>
</header>

<main class="workspace">
  <aside id="panelModel" class="panel" aria-label="Model tree" data-sheet-name="model">
    <div class="panel-head"><h2>Model</h2><button class="sheet-close icon" aria-label="Close">✕</button></div>
    <div class="panel-body" id="tree"></div>
  </aside>

  <section class="viewport-wrap" aria-label="3D view">
    <div id="viewport" class="viewport"></div>
    <div class="view-toolbar top-left">
      <div class="seg view-presets" role="group" aria-label="View presets">
        <button data-view="perspective" title="Perspective projection">Persp</button>
        <button data-view="iso" title="Isometric projection (orthographic)">Iso</button>
        <button data-view="top" aria-pressed="false" title="Show top view">Top</button>
        <button data-view="front" aria-pressed="false" title="Show front view">Front</button>
        <button data-view="right" aria-pressed="false" title="Show right view">Right</button>
      </div>
      <div class="seg toggles" role="group" aria-label="Show">
        <button data-toggle="domain" aria-pressed="false" title="Simulation domain and mesh refinement boxes">Domain</button>
        <button data-toggle="ports" aria-pressed="true" title="Ports">Ports</button>
        <button data-toggle="grid" aria-pressed="true" title="Ground grid">Grid</button>
        <button id="meshToggle" aria-pressed="false" title="Show actual FDTD mesh">Mesh</button>
        <button data-toggle="xray" aria-pressed="false" title="Transparent solids">X-ray</button>
      </div>
      <label id="caseWrap" class="case-select">
        <span>Case</span>
        <select id="caseSelect" aria-label="Sweep case to preview"></select>
      </label>
      <label id="patternWrap" class="case-select" hidden>
        <span>Pattern</span><select id="patternSelect" aria-label="Radiation pattern frequency"></select>
      </label>
      <div id="meshTools" class="mesh-tools" hidden>
        <div class="mesh-control-row">
          <select id="meshPlane" aria-label="Mesh view plane"><option>XY</option><option selected>XZ</option><option>YZ</option><option>3D</option></select>
          <button id="meshSmallest" type="button" title="Jump to the smallest mesh interval">Min cell</button>
          <label><input id="meshHighlight" type="checkbox" checked> Min</label>
          <label><input id="meshPml" type="checkbox"> PML</label>
        </div>
        <div class="mesh-control-row">
          <label for="meshSlice">Slice</label><input id="meshSlice" type="range" min="0" max="1" step="1" value="0" aria-label="Mesh slice index">
          <label for="meshOpacity">Opacity</label><input id="meshOpacity" type="range" min="0.1" max="1" step="0.05" value="0.45">
        </div>
        <div id="meshReadout" class="mesh-readout" role="status"></div>
      </div>
      <div id="radiationTools" class="radiation-tools" hidden>
        <div class="seg" role="group" aria-label="Radiation sections">
          <button data-section="XY" aria-pressed="true" title="XY section: Z = 0, or probe Z when Follow is active">XY</button>
          <button data-section="YZ" aria-pressed="true" title="YZ section: X = 0, or probe X when Follow is active">YZ</button>
          <button data-section="XZ" aria-pressed="true" title="XZ section: Y = 0, or probe Y when Follow is active">XZ</button>
          <button id="sectionFollow" aria-pressed="false" title="Follow the visible sampling point; off keeps planes at the global origin">Follow</button>
          <button id="probeToggle" aria-pressed="true" title="Show sampling point">Point</button>
        </div>
      </div>
    </div>
    <div id="probeReadout" class="probe-readout probe-overlay" hidden>
      <div class="probe-head"><button id="probeSelect" title="Select point and show XYZ translation gizmo">Probe</button><button id="probeReset" title="Reset to peak direction">Reset</button></div>
      <div class="probe-metrics">
        <span>D <b id="probeDirectivity"></b></span><span>Gain <b id="probeGain"></b></span>
        <span>Realized <b id="probeRealized"></b></span><span>Rel. E <b id="probeField"></b></span>
      </div>
      <details class="probe-details"><summary>Point details</summary>
        <div id="probePosition"></div><div id="probeAngles"></div>
        <div id="probeFrequency"></div><div id="probeEfficiency"></div>
        <small>Directional far field · click point to drag XYZ</small>
      </details>
    </div>
    <div class="view-toolbar bottom-right">
      <div class="add-wrap">
        <button id="addButton" class="fab" aria-haspopup="menu" aria-expanded="false" aria-label="Add"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div id="addMenu" class="menu add-menu" role="menu" hidden></div>
      </div>
    </div>
    <div id="selectionChip" class="selection-chip" hidden>
      <span id="chipText"></span>
      <button id="chipEdit" class="primary">Edit</button>
    </div>
    <div id="viewError" class="view-error" hidden></div>
  </section>

  <aside id="panelInspect" class="panel" aria-label="Inspector" data-sheet-name="inspect">
    <div class="panel-head"><h2 id="inspectTitle">Inspector</h2><div id="inspectActions" class="head-actions"></div><button class="sheet-close icon" aria-label="Close">✕</button></div>
    <div class="panel-body" id="inspector"></div>
  </aside>

  <section class="dock" aria-label="Params, scripts, checks and simulation">
    <div id="dockResize" class="dock-resize" role="separator" aria-label="Resize bottom dock" aria-orientation="horizontal" aria-valuemin="150" aria-valuemax="600" aria-valuenow="270" tabindex="0" title="Drag to resize; double-click to reset"></div>
    <div class="dock-tabs" role="tablist">
      <button role="tab" data-dock="params" aria-selected="true">Params</button>
      <button role="tab" data-dock="scripts" aria-selected="false">Scripts</button>
      <button role="tab" data-dock="checks" aria-selected="false">Checks <span id="checkBadge" class="badge"></span></button>
      <button role="tab" data-dock="sim" aria-selected="false">Simulation <span id="caseBadge" class="badge info"></span><span id="simBadge" class="badge run"></span></button>
      <button role="tab" data-dock="results" aria-controls="panelResults" aria-selected="false">Results</button>
      <button id="dockToggle" class="icon dock-toggle" aria-label="Collapse dock" title="Collapse / expand"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div id="panelParams" class="panel dock-panel" data-sheet-name="params" data-dock-name="params">
      <div class="panel-head sheet-only"><h2>Params</h2><button class="sheet-close icon" aria-label="Close">✕</button></div>
      <div class="panel-body" id="params"></div>
    </div>
    <div id="panelScripts" class="panel dock-panel" data-sheet-name="scripts" data-dock-name="scripts" hidden>
      <div class="panel-head sheet-only"><h2>Scripts</h2><button class="sheet-close icon" aria-label="Close">✕</button></div>
      <div class="panel-body" id="scripts"></div>
    </div>
    <div id="panelChecks" class="panel dock-panel" data-sheet-name="checks" data-dock-name="checks" hidden>
      <div class="panel-head sheet-only"><h2>Checks</h2><button class="sheet-close icon" aria-label="Close">✕</button></div>
      <div class="panel-body" id="checks"></div>
    </div>
    <div id="panelSim" class="panel dock-panel" data-sheet-name="sim" data-dock-name="sim" hidden>
      <div class="panel-head sheet-only"><h2>Simulation</h2><button class="sheet-close icon" aria-label="Close">✕</button></div>
      <div class="panel-body" id="sim"></div>
    </div>
    <div id="panelResults" class="panel dock-panel" data-sheet-name="results" data-dock-name="results" hidden>
      <div class="panel-head results-head"><h2>Simulation results</h2><label class="result-case"><select id="resultCase" aria-label="Simulation results case"></select><span id="resultCaseCount" class="muted"></span></label><button class="sheet-close icon" aria-label="Close">✕</button></div>
      <div class="panel-body" id="resultBody">
        <div id="resultCharts" class="sim-results"></div>
      </div>
    </div>
    <div id="panelJson" class="panel dock-panel" data-sheet-name="json" data-dock-name="json" hidden>
      <div class="panel-head sheet-only"><h2>JSON</h2><button class="sheet-close icon" aria-label="Close">✕</button></div>
      <div class="panel-body json-body">
        <div class="json-actions">
          <div class="seg" role="group" aria-label="JSON view">
            <button id="jsonSource" aria-pressed="true">Source (template)</button>
            <button id="jsonResolved" aria-pressed="false">Resolved case</button>
          </div>
          <button id="jsonApply" class="primary">Apply</button>
        </div>
        <div class="json-tools">
          <button id="jsonFormat" type="button">Format</button>
          <button id="jsonWrap" type="button" aria-pressed="true">Wrap</button>
          <button id="jsonMax" type="button" aria-pressed="false">Expand</button>
          <button id="jsonDiscard" type="button" disabled>Discard edits</button>
        </div>
        <textarea id="jsonText" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" aria-label="Configuration JSON"></textarea>
        <div id="jsonStatus" class="json-status" role="status" aria-live="polite"></div>
      </div>
    </div>
  </section>
</main>

<nav class="mobile-nav" aria-label="Panels">
  <button data-sheet="model"><span aria-hidden="true"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8.5 4.5L12 12 3.5 7.5zM3.5 12 12 16.5l8.5-4.5M3.5 16.5 12 21l8.5-4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Model</button>
  <button data-sheet="params"><span aria-hidden="true"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0M14 4v4M8 10v4M16 16v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Params</button>
  <button data-sheet="scripts"><span aria-hidden="true"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Scripts</button>
  <button data-sheet="checks"><span aria-hidden="true"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7.5 3v5.5c0 4.5-3.2 8-7.5 9.5-4.3-1.5-7.5-5-7.5-9.5V6zM8.5 12l2.5 2.5 4.5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Checks<span id="checkBadgeMobile" class="badge"></span></button>
  <button data-sheet="sim"><span aria-hidden="true"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h3l2.5-6 4 12 3-9 2 3H21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Simulation<span id="simBadgeMobile" class="badge run"></span></button>
  <button data-sheet="results"><span aria-hidden="true">∿</span>Results</button>
</nav>

<footer class="statusbar"><span id="status" role="status">Loading…</span><span class="muted status-note">CSXCAD editor · openEMS browser simulation</span></footer>

<dialog id="dialog">
  <form method="dialog">
    <h2 id="dialogTitle"></h2>
    <div id="dialogBody"></div>
    <div class="dialog-actions" id="dialogActions"><button value="close">Close</button></div>
  </form>
</dialog>
</body>
</html>
