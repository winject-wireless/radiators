<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 360" role="img" aria-label="Side view schematic of the photo-inspired 2.45 GHz 16-rod Yagi, showing 15 directors, elliptical folded driven loop, and rear reflector">
