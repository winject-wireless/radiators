name: Yagi sweep generator tests

on:
  pull_request:
    paths:
      - 'scripts/yagi_sweep.py'
      - 'antennas/yagi_16rod_bonded_boom_measured_loop_2450.json'
      - '.github/workflows/yagi-sweep-check.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/yagi_sweep.py'
      - 'antennas/yagi_16rod_bonded_boom_measured_loop_2450.json'
      - '.github/workflows/yagi-sweep-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python sweep generator
        run: python -m py_compile scripts/yagi_sweep.py
      - name: Generate and validate all screening geometries
        run: python scripts/yagi_sweep.py --self-test
