name: Structured openEMS simulations
on:
  workflow_dispatch:
    inputs:
      antenna:
        description: 'Antenna config path to simulate (e.g. antennas/example_monopole.json)'
        required: true
        type: string
  push:
    paths:
      - 'antennas/**'
      - 'site/**'
      - 'docker/openems/**'
      - 'scripts/**'
      - '.github/workflows/openems-structured.yml'
  pull_request:
    paths:
      - 'antennas/**'
      - 'site/**'
      - 'docker/openems/**'
      - 'scripts/**'
      - '.github/workflows/openems-structured.yml'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: radiators-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  select-runner:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
      selected-type: ${{ steps.pick.outputs.selected-type }}
    steps:
      - name: Prefer an available Linux self-hosted runner on trusted main
        id: pick
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RUNNER_STATUS_TOKEN || github.token }}
          script: |
            const trusted = context.eventName !== 'pull_request' && context.ref === 'refs/heads/main';
            if (!trusted) {
              core.setOutput('runner', JSON.stringify('ubuntu-latest'));
              core.setOutput('selected-type', 'github-hosted-untrusted');
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sources = [
              {kind: 'repository', route: 'GET /repos/{owner}/{repo}/actions/runners',
               args: {owner, repo, per_page: 100}},
              {kind: 'organization', route: 'GET /orgs/{org}/actions/runners',
               args: {org: owner, per_page: 100}},
            ];
            let runners = [];
            for (const source of sources) {
              try {
                runners.push(...await github.paginate(source.route, source.args));
              } catch (error) {
                core.warning(`${source.kind} runner inventory unavailable: ${error.status || ''} ${error.message}`);
              }
            }
            runners = [...new Map(runners.map(r => [r.id, r])).values()];
            const eligible = runners.filter(r => {
              const labels = new Set((r.labels || []).map(l => l.name.toLowerCase()));
              return r.status === 'online' && !r.busy
                && ['self-hosted', 'linux', 'x64'].every(label => labels.has(label));
            });
            const selected = eligible.length ? ['self-hosted', 'Linux', 'X64'] : 'ubuntu-latest';
            core.setOutput('runner', JSON.stringify(selected));
            core.setOutput('selected-type', eligible.length ? 'self-hosted' : 'github-hosted');
            core.notice(eligible.length
              ? `Prefer self-hosted: ${eligible.length} online idle Linux runner(s)`
              : 'No idle self-hosted runner visible; using ubuntu-latest');

  simulate:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner) }}
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify only the best Yagi simulation is retained
        run: |
          python3 - <<'PY'
          from pathlib import Path
          expected = 'yagi_16rod_bonded_boom_measured_loop_best_p24_f24_b36_y14_fine_2450.json'
          found = {path.name for path in Path('antennas').glob('yagi_*.json')}
          assert found == {expected}, f'Only the best Yagi config should exist: {found}'
          PY
      - name: Validate generic parameter sweeps without openEMS
        run: |
          python3 -m unittest discover -s scripts -p 'test_sweep.py' -v
          python3 -m unittest discover -s scripts -p 'test_missing_simulations.py' -v
          python3 scripts/sweep.py examples/racetrack_loop_sweep.json
          python3 scripts/sweep.py examples/helix_sweep.json
      - name: Detect changed antenna configurations
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          INPUT_ANTENNA: ${{ inputs.antenna }}
        shell: bash
        run: |
          set -euo pipefail
          : > changed-antennas.txt
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            [[ "$INPUT_ANTENNA" =~ ^antennas/[a-zA-Z0-9_-]+\.json$ ]] || { echo "Invalid antenna path"; exit 1; }
            [[ -f "$INPUT_ANTENNA" ]] || { echo "Antenna not found: $INPUT_ANTENNA"; exit 1; }
            printf '%s\n' "$INPUT_ANTENNA" >> changed-antennas.txt
          else
            if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
              git fetch origin main
              BASE_SHA="$(git merge-base HEAD origin/main)"
            fi
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- 'antennas/*.json' |
              while IFS= read -r candidate; do
                if [[ "$candidate" =~ ^antennas/[a-zA-Z0-9_-]+\.json$ ]] && [[ -f "$candidate" ]]; then
                  printf '%s\n' "$candidate"
                fi
              done > changed-antennas.txt
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" HEAD -- \
              'antennas/generators/*.py' 'scripts/sweep.py' > changed-sweep-code.txt
            python3 scripts/select_sweep_dependents.py --changed changed-sweep-code.txt >> changed-antennas.txt
            sort -u changed-antennas.txt -o changed-antennas.txt
          fi
          echo "Selected antenna configurations:"
          cat changed-antennas.txt
          echo "count=$(wc -l < changed-antennas.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - name: Restore prior published results before planning simulations
        # Missing published cases must be identified *before* deciding whether
        # Docker is needed. Changed antenna configs are excluded from reuse.
        run: python3 site/restore_published.py --site-url https://winject-wireless.github.io/radiators/ --results results
      # Retain the best fine-mesh Yagi result if it is not already published.
      - name: Download completed best-parameter fine-mesh Yagi
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: yagi-best-p24-f24-b36-y14-fine
          run-id: 44854383879
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: _archived/fine
      - name: Merge complete archived antenna results into viewer inputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 site/merge_archived_results.py \
            --source _archived/fine \
            --results results --changed changed-antennas.txt
      - name: Select changed and missing antenna simulations
        id: plan
        env:
          FILL_MISSING: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$FILL_MISSING" == "true" ]]; then args+=(--include-missing); fi
          python3 scripts/select_missing_simulations.py --changed changed-antennas.txt \
            --results results --output selected-antennas.txt "${args[@]}"
          echo "count=$(wc -l < selected-antennas.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "Simulation plan:"
          cat selected-antennas.txt
      - name: Restore or bootstrap openEMS Docker image
        id: image
        if: steps.plan.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_RUNNER: ${{ needs.select-runner.outputs.selected-type }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SELECTED_RUNNER" == "self-hosted" ]]; then
            # Self-hosted runner images are persistent and may not have gh/jq/zstd.
            # The stdlib Python restorer reuses a local image or retrieves the
            # versioned artifact without compiling openEMS.
            python3 scripts/restore_openems_image.py
            digest="$(sha256sum docker/openems/Dockerfile | cut -d' ' -f1)"
            echo "artifact_name=openems-image-${digest}" >> "$GITHUB_OUTPUT"
            echo "cache_hit=true" >> "$GITHUB_OUTPUT"
          else
            # Hosted runners can bootstrap/cache an image if no artifact exists.
            bash scripts/ensure-openems-image.sh
          fi
      - name: Save new solver image artifact (only on first build)
        if: steps.plan.outputs.count != '0' && steps.image.outputs.cache_hit == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.image.outputs.artifact_name }}
          path: openems-image.tar.zst
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
      - name: Simulate missing or changed cases within runner CPU/RAM limits
        if: steps.plan.outputs.count != '0'
        run: |
          python3 scripts/run_simulations.py --list selected-antennas.txt --results results \
            --skip-complete --cpus-per-job 2 --memory-gib-per-job 5 --reserve-memory-gib 2
      - name: Build and verify complete static result viewer
        env:
          REQUIRE_TARGET: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$REQUIRE_TARGET" == "true" ]]; then
            args+=(--require-result yagi_16rod_bonded_boom_measured_loop_best_p24_f24_b36_y14_fine_2450)
          fi
          python3 site/build_site.py --results results --site site/dist "${args[@]}"
          node --check site/dist/app.js
          node --check site/dist/plotly.min.js
          node site/check_viewer.js site/dist
          node site/check_camera.js site/dist
          node site/check_intersection.js site/dist
          python3 - <<'PY'
          import json
          from pathlib import Path
          site = Path("site/dist")
          manifest = json.loads((site/"manifest.json").read_text())
          for entry in manifest["runs"]:
              result = json.loads((site/entry["path"]).read_text())
              for pattern in result["patterns"]:
                  path = site/entry["path"]
                  file = path.parent/pattern["file"]
                  assert file.is_file(), file
                  json.loads(file.read_text())
          print("Verified", len(manifest["runs"]), "simulations and all referenced frequency patterns")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structured-openems-results
          path: |
            changed-antennas.txt
            selected-antennas.txt
            results/*/case_config.json
            results/*/result.json
            results/*/pattern_*.json
            results/*/geometry.xml
            results/*/runner.log
            results/scheduler.json
            site/dist/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: site/dist
  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: simulate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
