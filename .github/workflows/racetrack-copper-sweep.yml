name: Racetrack solid copper aspect and diameter sweep
on:
  push:
    branches: ['sim/racetrack-copper-sweep-*']
    paths:
      - 'tools/racetrack_sweep.py'
      - '.github/workflows/racetrack-copper-sweep.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: racetrack-copper-${{ github.ref }}
  cancel-in-progress: true
# Runner selection must inspect availability; do not pin fi1 or default hosted.
# RUNNER_STATUS_TOKEN needs read access to repository and org runner inventory.
jobs:
  select-runner:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
      selected-type: ${{ steps.pick.outputs.selected-type }}
    steps:
      - name: Prefer any available Linux self-hosted runner
        id: pick
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.RUNNER_STATUS_TOKEN || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sources = [
              {kind: 'repository', route: 'GET /repos/{owner}/{repo}/actions/runners',
               args: {owner, repo, per_page: 100}},
              {kind: 'organization', route: 'GET /orgs/{org}/actions/runners',
               args: {org: owner, per_page: 100}},
            ];
            let runners = [];
            let accessibleSources = 0;
            for (const source of sources) {
              try {
                const found = await github.paginate(source.route, source.args);
                accessibleSources += 1;
                core.info(`${source.kind}: ${found.length} registered runners`);
                runners.push(...found);
              } catch (error) {
                core.warning(`${source.kind} runner status unavailable: ${error.status || ''} ${error.message}`);
              }
            }
            runners = [...new Map(runners.map(r => [r.id, r])).values()];
            const eligible = runners.filter(r => {
              const labels = new Set((r.labels || []).map(l => l.name.toLowerCase()));
              return r.status === 'online' && !r.busy
                && ['self-hosted', 'linux', 'x64'].every(x => labels.has(x));
            });
            if (!eligible.length && accessibleSources < sources.length) {
              core.setFailed('Unable to verify self-hosted runner availability: runner inventory API access was denied. Configure RUNNER_STATUS_TOKEN with repository Administration: Read and org self-hosted-runner Read permission. Refusing an unjustified hosted fallback.');
              return;
            }
            const selected = eligible.length ? ['self-hosted', 'Linux', 'X64'] : 'ubuntu-latest';
            const type = eligible.length ? 'self-hosted' : 'github-hosted';
            core.setOutput('runner', JSON.stringify(selected));
            core.setOutput('selected-type', type);
            if (eligible.length) {
              core.notice(`Selected available self-hosted Linux runner pool; ${eligible.length} idle matching runner(s).`);
            } else {
              core.notice(`Selected ubuntu-latest; no available self-hosted Linux runner was visible (${accessibleSources}/2 APIs readable).`);
              if (!accessibleSources) {
                core.warning('Runner inventory API access is restricted. Add RUNNER_STATUS_TOKEN with repository Administration: Read (and organization runner-read permission if required) to enable self-hosted preference.');
              }
            }

  sweep:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner) }}
    timeout-minutes: 240
    steps:
      - name: Verify selected runner and Linux Docker
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: ${RUNNER_NAME}; policy: ${{ needs.select-runner.outputs.selected-type }}"
          docker info --format 'Docker OS: {{.OSType}}; CPUs: {{.NCPU}}; RAM: {{.MemTotal}}'
          [[ "$(docker info --format '{{.OSType}}')" == linux ]]
      - uses: actions/checkout@v4
      - name: Validate geometry and aligned center feed
        run: |
          python3 -m py_compile tools/racetrack_sweep.py
          python3 tools/racetrack_sweep.py --self-test
      - name: Generate all 24 racetrack cases
        run: python3 tools/racetrack_sweep.py --generate
      - name: Restore cached prebuilt openEMS image
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ensure-openems-image.sh
      - name: Run antenna simulations constrained by available CPU and RAM
        run: |
          python3 scripts/run_simulations.py --list racetrack-sweep-inputs.txt \
            --results results --cpus-per-job 2 --memory-gib-per-job 5 \
            --reserve-memory-gib 2
      - name: Evaluate and rank impedance/match at 2.45GHz
        if: always()
        run: python3 tools/racetrack_sweep.py --summarize
      - name: Archive cases, results, logs and rankings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: racetrack-copper-aspect-diameter-sweep
          path: |
            antennas/racetrack_ar*_d*_2450.json
            racetrack-sweep-inputs.txt
            results/racetrack_copper_sweep/
            results/racetrack_ar*_d*_2450/result.json
            results/racetrack_ar*_d*_2450/pattern_*.json
            results/racetrack_ar*_d*_2450/runner.log
            results/scheduler.json
          if-no-files-found: warn
          retention-days: 21
